server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 启用 gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # 通用 CORS 代理（解决所有外部资源跨域问题）
    location /cors-proxy {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # 通知代理转发 → Node.js proxy (port 3001)
    location /proxy {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 15s;
    }

    # 代理健康检查
    location /health {
        proxy_pass http://127.0.0.1:3001/health;
    }

    # 腾讯CDN反向代理（解决跨域CORS问题）
    location /cdn-proxy/tencent/ {
        proxy_pass http://webcdn.m.qq.com/;
        proxy_set_header Host webcdn.m.qq.com;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
        add_header Access-Control-Allow-Headers '*' always;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # 腾讯测速上传接口反代
    location /cdn-proxy/netsp/ {
        proxy_pass http://netsp.master.qq.com/;
        proxy_set_header Host netsp.master.qq.com;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
        add_header Access-Control-Allow-Headers '*' always;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        client_max_body_size 50m;
    }

    # 静态资源长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 图标等静态资源
    location ~* \.(png|ico|svg|webmanifest|mp3|ttf|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
